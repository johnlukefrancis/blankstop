name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
      - name: install deps
        run: pnpm install
      - name: build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: Blankstop ${{ github.ref_name }}
          releaseBody: Windows installer for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: false
