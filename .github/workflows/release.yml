name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
      - name: install deps
        run: pnpm install
      - name: verify versions match tag
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $tagVersion) { throw "Unable to read tag version from ref name." }
          $pkgVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoToml = Get-Content src-tauri/Cargo.toml -Raw
          $cargoMatch = [regex]::Match($cargoToml, '(?ms)^\[package\].*?^version\s*=\s*"([^"]+)"')
          if (-not $cargoMatch.Success) { throw "Cargo.toml [package] version not found." }
          $cargoVersion = $cargoMatch.Groups[1].Value
          if ($pkgVersion -ne $tagVersion -or $tauriVersion -ne $tagVersion -or $cargoVersion -ne $tagVersion) {
            throw "Version mismatch: tag=$tagVersion package.json=$pkgVersion tauri.conf.json=$tauriVersion Cargo.toml=$cargoVersion"
          }
      - name: build and release
        uses: tauri-apps/tauri-action@v0.6.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: Blankstop ${{ github.ref_name }}
          releaseBody: Windows installer for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: false
