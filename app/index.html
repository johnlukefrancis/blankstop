<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/toast.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blankstop Settings</title>
    <script type="module" src="/src/config/settings.ts" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <h1>Blankstop</h1>
          <p class="subtitle">Clipboard sanitizer for terminal copy and paste.</p>
        </div>
        <div class="status" id="status-pill">Enabled</div>
      </header>

      <section class="card">
        <h2>Behavior</h2>
        <div class="toggle-row">
          <label class="toggle">
            <input id="enabled" type="checkbox" />
            <span>Enabled</span>
          </label>
          <label class="toggle">
            <input id="toast_enabled" type="checkbox" />
            <span>Toast notifications</span>
          </label>
          <label class="toggle">
            <input id="only_allowlisted" type="checkbox" />
            <span>Only sanitize allowlisted apps</span>
          </label>
          <label class="toggle">
            <input id="run_on_startup" type="checkbox" />
            <span>Run on startup</span>
          </label>
        </div>
      </section>

      <section class="card">
        <h2>Allowlist</h2>
        <p class="hint">One executable per line.</p>
        <textarea id="allowlist" rows="7"></textarea>
      </section>

      <section class="card">
        <h2>Recent activity</h2>
        <div class="meta">
          <span class="label">Last source</span>
          <span id="last-source">None</span>
        </div>
        <div class="log" id="log"></div>
      </section>
    </main>

    <div id="toast-root" class="toast">
      <div class="title">Blankstop</div>
      <div id="message" class="message">Sanitized clipboard</div>
    </div>
  </body>
</html>
