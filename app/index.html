<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlankStop Settings</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/settings.css" />
    <link rel="stylesheet" href="/css/toast.css" />
    <link rel="stylesheet" href="/css/tray_menu.css" />
    <script type="module" src="/src/config/settings.ts" defer></script>
  </head>
  <body>
    <main class="settings">
      <div class="settings__left">
        <button class="btn btn--ghost" id="reset-allowlist">Reset defaults</button>

        <div class="toggle-group">
            <label class="toggle">
              <input id="enabled" type="checkbox" />
              <span class="toggle__switch"></span>
              <span class="toggle__label">Enabled</span>
            </label>
            <label class="toggle">
              <input id="toast_enabled" type="checkbox" />
              <span class="toggle__switch"></span>
              <span class="toggle__label">Toast notifications</span>
            </label>
            <label class="toggle">
              <input id="status_toast_enabled" type="checkbox" />
              <span class="toggle__switch"></span>
              <span class="toggle__label">Status change toasts</span>
            </label>
            <label class="toggle">
              <input id="only_allowlisted" type="checkbox" />
              <span class="toggle__switch"></span>
              <span class="toggle__label">Only allowlisted apps</span>
            </label>
            <label class="toggle">
              <input id="run_on_startup" type="checkbox" />
              <span class="toggle__switch"></span>
              <span class="toggle__label">Run on startup</span>
            </label>
        </div>

        <div class="status-info">
          <div class="status-row">
            <span class="status-label">Last source</span>
            <span class="status-value" id="last-source">None</span>
          </div>
          <div class="status-row">
            <span class="status-label">Last action</span>
            <span class="status-value" id="last-action">Never</span>
          </div>
        </div>
      </div>

      <section class="section settings__right">
        <h2 class="section__title">Allowlist</h2>
        <textarea
          id="allowlist"
          class="textarea"
          placeholder="WindowsTerminal.exe&#10;Code.exe&#10;..."
        ></textarea>
        <span class="hint">One executable per line</span>
      </section>
    </main>

    <div id="toast-root" class="toast">
      <div id="message" class="message">✓ Clipboard sanitized</div>
    </div>

    <div id="tray-menu-root" class="tray-menu">
      <label class="tray-menu__item tray-menu__item--toggle">
        <input id="menu-enabled" type="checkbox" />
        <span class="tray-menu__toggle"></span>
        <span>Enabled</span>
      </label>
      <!-- <button id="menu-pause" class="tray-menu__item">Pause 5 min</button> -->
      <button id="menu-settings" class="tray-menu__item">Settings...</button>
      <button id="menu-sanitize" class="tray-menu__item">Sanitize clipboard now</button>
      <hr class="tray-menu__separator" />
      <button id="menu-quit" class="tray-menu__item tray-menu__item--danger">Quit</button>
    </div>
  </body>
</html>
